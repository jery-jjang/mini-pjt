<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulnWatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 로컬 실행용 화면. 교육용 더미 데이터를 다룬다. 서버(app.py)가 /ui에서 이 파일을 내준다. -->
  <header class="topbar">
    <div class="brand">
      <svg class="icon brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
      <span>VulnWatch</span>
    </div>

    <div class="account">
      <label for="account-select">계정</label>
      <select id="account-select"></select>
    </div>

    <button type="button" class="scan-status" id="settings-open" aria-haspopup="dialog">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span id="scan-summary">검색 주기 불러오는 중</span>
    </button>
  </header>

  <main class="layout">
    <!-- 왼쪽: 계정이 볼 수 있는 프로젝트와 등록 SW -->
    <aside class="panel inventory" aria-labelledby="inventory-title">
      <div class="panel-head">
        <h2 id="inventory-title">등록된 SW</h2>
        <button type="button" class="icon-button" id="inventory-refresh" aria-label="등록 목록 새로 고침">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <p class="muted small" id="inventory-scope"></p>
      <div id="inventory-list" class="inventory-list"></div>
    </aside>

    <!-- 가운데: 질문과 답변 -->
    <section class="panel chat" aria-labelledby="chat-title">
      <div class="panel-head">
        <h2 id="chat-title">질문</h2>
        <button type="button" class="text-button" id="chat-clear">대화 지우기</button>
      </div>

      <div id="chat-log" class="chat-log" aria-live="polite" aria-relevant="additions">
        <div class="empty" id="chat-empty">
          <p>프로젝트의 취약점 해당 여부, 현황, 취약점 설명을 묻거나 SW를 등록할 수 있습니다.</p>
          <p class="muted small">예시를 눌러 바로 물어볼 수 있습니다.</p>
        </div>
      </div>

      <div class="examples" id="examples" aria-label="예시 질문"></div>

      <form id="ask-form" class="ask-form">
        <label for="question" class="visually-hidden">질문</label>
        <textarea id="question" rows="2" placeholder="예: Log4j 2.14.1에 해당하는 취약점이 뭐야?" required></textarea>
        <button type="submit" class="primary" id="ask-button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
          <span>보내기</span>
        </button>
      </form>
      <p class="muted small hint">요청마다 대화가 새로 시작됩니다. 앞서 한 질문은 기억하지 않고, 등록 후보만 계정별로 저장됩니다.</p>
    </section>

    <!-- 오른쪽: 선택한 답변의 근거와 실행 기록 -->
    <aside class="panel detail" aria-labelledby="detail-title">
      <div class="panel-head">
        <h2 id="detail-title">응답 상세</h2>
      </div>
      <div id="detail-body">
        <p class="muted">답변을 고르면 라벨, 근거 문서, 실행 기록을 보여 줍니다.</p>
      </div>
    </aside>
  </main>

  <!-- 검색 주기 설정 -->
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-body" id="settings-form" novalidate>
      <h2 id="settings-title">주기 검색 설정</h2>
      <dl class="settings-grid">
        <dt>주기 검색</dt><dd id="set-enabled">-</dd>
        <dt>지금 주기</dt><dd id="set-interval">-</dd>
        <dt>마지막 검색</dt><dd id="set-last">-</dd>
        <dt>다음 검색</dt><dd id="set-next">-</dd>
      </dl>

      <div class="field">
        <label for="interval-input">새 주기 (시간)</label>
        <input id="interval-input" type="number" min="0.01" step="0.5" inputmode="decimal" aria-describedby="interval-help interval-error">
        <p class="muted small" id="interval-help">0보다 큰 값. 바꾸면 지금부터 새 주기 뒤에 다음 검색이 돕니다. 보안 담당자만 바꿀 수 있습니다.</p>
        <p class="error-text" id="interval-error" role="alert"></p>
      </div>

      <div class="dialog-actions">
        <button type="button" class="secondary" id="settings-close">닫기</button>
        <button type="button" class="primary" id="interval-save">주기 바꾸기</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
